[project]
name = "pyas2lib"
version = "1.4.4"
description = "Python library for building and parsing AS2 Messages"
readme = "README.md"
license = "GPL-3.0"
authors = [
    { name = "Abhishek Ram", email = "abhishek8816@gmail.com" }
]
requires-python = ">=3.10.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications",
]
dependencies = [
    "asn1crypto==1.5.1",
    "oscrypto",
    "pyopenssl>=23.2.0",
]

[project.urls]
Homepage = "https://github.com/abhishek-ram/pyas2-lib"
Repository = "https://github.com/abhishek-ram/pyas2-lib"

[project.optional-dependencies]
tests = [
    "black==22.6.0",
    "coverage==5.0.4",
    "pyflakes==2.4.0",
    "pylama==8.3.7",
    "pylama-pylint==3.1.1",
    "pylint==2.12.1",
    "pytest==7.4.4",
    "pytest-asyncio==0.21.1",
    "pytest-black==0.3.12",
    "pytest-cov==2.8.1",
    "toml==0.10.2",
]

[dependency-groups]
test = [
    "black==22.6.0",
    "coverage==5.0.4",
    "pyflakes==2.4.0",
    "pylama==8.3.7",
    "pylama-pylint==3.1.1",
    "pylint==2.12.1",
    "pytest==7.4.4",
    "pytest-asyncio==0.21.1",
    "pytest-black==0.3.12",
    "pytest-cov==2.8.1",
    "toml==0.10.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["test*"]

[tool.uv.sources]
oscrypto = { git = "https://github.com/wbond/oscrypto.git", rev = "master" }
